name: Expressive Profile

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - cycle.json
      - scripts/cycle.mjs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metawka/expressive-profile@v1
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Cycling subtitle
        run: |
          node scripts/cycle.mjs
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "Cycling subtitle" && git push)
